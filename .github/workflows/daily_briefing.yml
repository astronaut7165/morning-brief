name: Daily Briefing

# 기본 운영은 로컬 Mac(launchd + Claude Code 구독)입니다. 이 워크플로는 API 키로 돌리는 대안·수동 실행용입니다.
# GitHub 에서 매일 돌리려면 아래 schedule 주석을 풀고 로컬 launchd 는 해제하세요 (중복 실행 방지).
on:
  # schedule:
  #   # 매일 07:00 KST (= 전날 22:00 UTC). GitHub 스케줄러 특성상 수~수십 분 늦게 시작될 수 있습니다.
  #   - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      notify:
        description: "메신저로 발송할까요?"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run briefing pipeline
        env:
          # 저장소 Settings → Secrets and variables → Actions 에서 설정
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_EFFORT: ${{ vars.LLM_EFFORT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SKIP_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && !inputs.notify }}
        run: |
          flags=""
          [ "$SKIP_NOTIFY" = "true" ] && flags="--no-notify"
          status=0
          for cfg in config/sources.yaml config/crypto.yaml; do
            [ -f "$cfg" ] || continue
            python src/main.py --config "$cfg" $flags || status=1
          done
          exit $status

      # 분석이 실패해도(휴리스틱 대체) 수집 결과는 남기도록 항상 커밋
      - name: Commit vault
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vault state docs
          if git diff --cached --quiet; then
            echo "커밋할 변경 사항이 없습니다."
            exit 0
          fi
          git commit -m "briefing: $(TZ=Asia/Seoul date +%F)"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1
